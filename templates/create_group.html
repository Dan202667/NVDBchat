{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <h2>Создание группы</h2>
    
    <div class="form-group">
        <input type="text" id="groupName" placeholder="Название группы" required>
    </div>
    
    <div class="form-group">
        <label>Выберите участников:</label>
        <div id="contactsList" style="max-height: 300px; overflow-y: auto; background: #2a3942; border-radius: 12px; padding: 10px;">
            <div style="text-align: center; padding: 20px;">Загрузка контактов...</div>
        </div>
    </div>
    
    <div class="form-group">
        <label>Выбранные участники:</label>
        <div id="selectedList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
    </div>
    
    <button onclick="createGroup()" class="btn">Создать группу</button>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('chats') }}" style="color: #8696a0;">Отмена</a>
    </div>
</div>

<script>
    let contacts = [];
    let selectedUsers = [];
    
    fetch('/get_contacts')
        .then(response => response.json())
        .then(data => {
            contacts = data;
            const container = document.getElementById('contactsList');
            if (contacts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px;">Нет контактов. Сначала начните чат с пользователем.</div>';
                return;
            }
            container.innerHTML = '';
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.style.cssText = 'display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #3b4a54; cursor: pointer;';
                div.onclick = () => toggleSelect(contact);
                div.innerHTML = `
                    <div class="chat-avatar" style="width: 40px; height: 40px; margin-right: 12px;">
                        ${contact.avatar_url ? `<img src="${contact.avatar_url}" style="width: 40px; height: 40px; border-radius: 50%;">` : '👤'}
                    </div>
                    <div>
                        <div style="font-weight: 600;">${contact.name}</div>
                        <div style="font-size: 0.8rem; color: #8696a0;">@${contact.username}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        });
    
    function toggleSelect(contact) {
        const index = selectedUsers.findIndex(u => u.id === contact.id);
        if (index === -1) {
            selectedUsers.push(contact);
        } else {
            selectedUsers.splice(index, 1);
        }
        updateSelectedList();
    }
    
    function updateSelectedList() {
        const container = document.getElementById('selectedList');
        container.innerHTML = '';
        selectedUsers.forEach(user => {
            const badge = document.createElement('span');
            badge.style.cssText = 'background: #00a884; padding: 5px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px;';
            badge.innerHTML = `${user.name} <span style="cursor: pointer;" onclick="removeFromSelected(${user.id})">✕</span>`;
            container.appendChild(badge);
        });
        
        document.querySelectorAll('.contact-item').forEach((item, idx) => {
            const contact = contacts[idx];
            if (selectedUsers.some(u => u.id === contact.id)) {
                item.style.background = '#3b4a54';
            } else {
                item.style.background = '';
            }
        });
    }
    
    function removeFromSelected(userId) {
        selectedUsers = selectedUsers.filter(u => u.id !== userId);
        updateSelectedList();
    }
    
    function createGroup() {
        const groupName = document.getElementById('groupName').value.trim();
        if (!groupName) {
            alert('Введите название группы');
            return;
        }
        if (selectedUsers.length === 0) {
            alert('Выберите хотя бы одного участника');
            return;
        }
        
        const usernames = selectedUsers.map(u => u.username).join(',');
        
        const formData = new FormData();
        formData.append('group_name', groupName);
        formData.append('members', usernames);
        
        fetch('/create_group', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            }
        })
        .catch(err => console.error('Error:', err));
    }
</script>
{% endblock %}
