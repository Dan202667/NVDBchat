{% extends "base.html" %}
{% block header %}
<div class="app-header">
    <h1>NVDBchat</h1>
    <div>
        <span style="color:#8696a0; margin-right:15px;">{{ session.username }}</span>
        <a href="{{ url_for('chats') }}">К чатам</a>
        <a href="{{ url_for('profile') }}">Профиль</a>
        <a href="{{ url_for('logout') }}">Выйти</a>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <div class="chat-avatar" style="width: 40px; height: 40px;">
            {% if chat.type == 'group' %}
                👥
            {% else %}
                {% if other_avatar %}
                    <img src="{{ other_avatar }}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                {% else
