{% extends "base.html" %}
{% block content %}
<div class="auth-container" style="max-width: 400px;">
    <h2>Мой профиль</h2>
    
    <div style="text-align: center; margin-bottom: 30px;">
        {% if user.avatar_url %}
            <img src="{{ user.avatar_url }}" 
                 style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 20px;">
        {% else %}
            <div style="width: 100px; height: 100px; border-radius: 50%; background: #00a884; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: white;">
                {{ user.username[0]|upper if user.username else '?' }}
            </div>
        {% endif %}
        <div style="font-size: 1.5rem; font-weight: 600;">{{ user.name }}</div>
        <div style="color: #00a884;">@{{ user.username }}</div>
    </div>
    
    <form method="POST" action="{{ url_for('upload_avatar') }}" enctype="multipart/form-data">
        <div class="form-group">
            <label>Сменить аватар:</label>
            <input type="file" name="avatar" accept="image/*" required>
        </div>
        <button type="submit" class="btn">Загрузить</button>
    </form>
    
    <div class="form-group" style="margin-top: 20px;">
        <label style="color: #8696a0;">Дата регистрации</label>
        <div style="background: #2a3942; padding: 12px; border-radius: 8px;">
            {{ user.created_at.strftime('%d %B %Y, %H:%M') }}
        </div>
    </div>
    
    <a href="{{ url_for('chats') }}" class="btn" style="margin-top: 20px; display: block; text-align: center;">К чатам</a>
</div>
{% endblock %}
