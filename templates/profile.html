{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <div class="profile-header">
        <div class="back-button" onclick="goBack()">←</div>
        <div class="profile-avatar-large" onclick="showAvatarMenu()">
            {% if user.avatar_url %}
                <img src="{{ user.avatar_url }}" style="width: 120px; height: 120px; border-radius: 60px;">
            {% else %}
                <div style="width: 120px; height: 120px; border-radius: 60px; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-size: 48px;">
                    {{ user.username[0]|upper if user.username else '?' }}
                </div>
            {% endif %}
        </div>
        <div class="profile-name">{{ user.name }}</div>
        <div class="profile-username">@{{ user.username }}</div>
        <div class="profile-actions">
            <button class="profile-action-btn" onclick="navigateTo('/chats')">Написать</button>
            <button class="profile-action-btn" onclick="searchInChat()">Поиск</button>
        </div>
    </div>
    
    <div class="profile-section">
        <div class="section-title">Медиа</div>
        <div class="media-grid" id="mediaGrid"></div>
    </div>
    
    <div class="profile-section">
        <div class="section-title">Файлы</div>
        <div id="filesList"></div>
    </div>
    
    <div class="profile-section">
        <div class="section-title">Общие группы</div>
        <div id="commonGroups"></div>
    </div>
</div>

<script>
    function goBack() { window.history.back(); }
    function navigateTo(url) { window.location.href = url; }
    function searchInChat() { alert('Поиск в чате'); }
    function showAvatarMenu() { alert('Увеличить / Сохранить / Удалить'); }
    
    // Загрузка медиа
    fetch('/get_user_media/{{ user.id }}')
    .then(response => response.json())
    .then(data => {
        const mediaGrid = document.getElementById('mediaGrid');
        data.media.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.style.width = '80px';
            img.style.height = '80px';
            img.style.objectFit = 'cover';
            img.style.borderRadius = '8px';
            img.style.cursor = 'pointer';
            img.onclick = () => window.open(url);
            mediaGrid.appendChild(img);
        });
    });
</script>
{% endblock %}
