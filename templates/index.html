{% extends "base.html" %}

{% block content %}
<div class="welcome-container">
    <h1>Добро пожаловать в NVDBchat</h1>
    <div class="welcome-buttons">
        <button class="btn-large" onclick="openModal('loginModal')">Вход</button>
        <button class="btn-large" onclick="openModal('registerModal')">Регистрация</button>
    </div>
</div>

<!-- Модальное окно входа -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('loginModal')">&times;</span>
        <h2>Вход</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <input type="text" name="name" placeholder="Имя" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
    </div>
</div>

<!-- Модальное окно регистрации -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('registerModal')">&times;</span>
        <h2>Регистрация</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <input type="text" name="name" placeholder="Имя" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
    </div>
</div>

<script>
function openModal(id) {
    document.getElementById(id).style.display = "block";
}
function closeModal(id) {
    document.getElementById(id).style.display = "none";
}
// Закрыть модалку при клике вне её
window.onclick = function(event) {
    if (event.target.classList.contains('modal')) {
        event.target.style.display = "none";
    }
}
</script>
{% endblock %}
