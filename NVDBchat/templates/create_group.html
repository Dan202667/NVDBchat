{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <h2>Создание группы</h2>
    
    <form method="POST">
        <div class="form-group">
            <input type="text" name="group_name" placeholder="Название группы" required>
        </div>
        
        <div class="form-group">
            <input type="text" name="members" placeholder="@username участников (через запятую)" required>
            <small style="color: #8696a0; display: block; margin-top: 5px;">Вы будете добавлены автоматически</small>
        </div>
        
        <button type="submit" class="btn">Создать группу</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('chats') }}" style="color: #8696a0;">Отмена</a>
    </div>
</div>
{% endblock %}
